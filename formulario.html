<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - Gaming o Nada</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Gaming o Nada</h1>
    <p>Control de Acceso al Portal</p>
  </header>

  <main>
    <section class="formulario login-card">
      <h2>Iniciar Sesión</h2>
      <form id="formLogin" action="gaming.html" method="GET">
        
        <label for="email">Correo Electrónico:</label>
        <input 
          type="email" 
          id="email" 
          name="email" 
          pattern="facu\.flowers666@gmai\.com" 
          placeholder="facu.flowers666@gmai.com"
          required
        >

        <label for="password">Contraseña:</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          pattern="10100111" 
          placeholder="Ingresa tu clave"
          required
        >

        <button type="submit">Ingresar al Portal</button>
      </form>
    </section>
  </main>

  <footer>
    <p>EDI I - Tecnicatura Superior en Análisis de Sistemas - 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
