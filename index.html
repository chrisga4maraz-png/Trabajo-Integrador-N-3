
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Gaming o Nada</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Gaming o Nada</h1>
        <p>Ingresá para acceder al espacio gamer</p>
    </header>

    <main class="login-main">
        <section class="login-section">

            <h2>Iniciar sesión</h2>

            <p>
                Ingresá tus datos para continuar hacia Gaming o Nada.
            </p>

            <form id="formLogin">

                <label for="usuario">Correo electrónico:</label>
                <input
                    type="email"
                    id="usuario"
                    name="usuario"
                    placeholder="Ingrese correo electrónico"
                    required
                >

                <label for="password">Contraseña:</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Ingrese contraseña"
                    required
                >

                <button type="submit">Entrar al espacio</button>

                <p id="mensajeLogin" role="status"></p>

            </form>

        </section>
    </main>

    <footer>
        <p>Gaming o Nada | Todo sobre League of Legends</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
